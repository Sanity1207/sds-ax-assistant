goal: VESSEL·ACTION 매핑 문의를 로컬 Streamlit 웹 앱에서 등록하면 Python 규칙과 LLM 구조화 출력으로 자동 분류해
  SQLite 이슈대장(ISSUE)에 기록한다. 매핑 담당자는 FastMCP 도구를 쓰는 LangGraph ReAct 조사 비서와 대화하며 열린
  이슈를 조사한다. 비서가 만든 처리안(매핑 변경 + 상태 변경)은 담당자가 승인해야만 한 SQLite 트랜잭션으로 반영된다. 이 시스템을 C:\Users\SDS\Desktop\sds-ax-assistant에
  그린필드로 순수 구현 12시간 안에 만들고, SDS AX Day1~7 개념(구조화 출력, ReAct 루프, MCP, 에러 메시지=프롬프트, 실패
  분류·폴백, 승인 게이트, trace, 평가셋·전후 비교)을 실제로 적용한다.
task_type: code
brownfield_context:
  project_type: greenfield
  context_references: []
  existing_patterns: []
  existing_dependencies: []
constraints:
- Python 3.14, LangGraph ReAct(agent↔tools 순환 직접 조립, should_stop, finalize 노드, add_messages
  + 체크포인터 멀티턴)
- LLM은 AWS Bedrock Claude, .env의 BEDROCK_MODEL_IDS 우선순위 순서로 사용
- FastMCP 서버(stdio) + langchain-mcp-adapters로 Agent가 MCP 클라이언트이며, MCP 클라이언트는 이 Agent
  하나뿐
- '설치 허락 라이브러리: mcp, langchain-mcp-adapters, streamlit'
- '진행 순서: 문서(SERVICE.md → TASKS.md) 먼저, 그다음 구현'
- '시간 예산: 순수 구현 12시간(문서 작업 제외). 부족하면 ③ 값 이상 조사·④ 반려 재요청부터 축소·연기'
- '완성 순서: ⓪ DB·시드·사용자 선택·이슈대장 화면·처리 기록 장치 → Ⓐ 신규 등록·자동 분류·처리 기록 파일 출력 → ② 자유 질의 → ① 처리안 승인(처리대기·확인필요·이관 건 종결)
  → ③ 값 이상 조사 → ④ 반려 건 재요청 버튼'
- 데이터는 자체 시드 스크립트가 만든 SQLite 복사본(VESSEL_MST, ACTION_MST, VESSEL_ACTION, USER_MST,
  OWNER_MST, PROCESS_LOG, MESSAGE_LOG, CALL_LOG, ISSUE, RESOLUTION_LOG)이며 기존 sds-ax-project
  데이터·코드는 수정하지 않음(분류 스키마·프롬프트 참고만 가능)
- '마스터·매핑 시드 값은 기존 프로젝트와 같음: VESSEL_MST 5건(V001 반응기 A, V002 반응기 B, V003 혼합탱크 1, V004 저장탱크 1,
  V005 세정조 1), ACTION_MST 6건(101 원료 투입, 102 가열, 103 교반, 104 냉각, 105 배출, 106 세정), VESSEL_ACTION 7건(V001→101/102/103,
  V002→103, V003→103, V004→105, V005→106. 수행됨 Y = V001→101 2026-10-20 09:00:00, V001→102 2026-10-20 10:30:00,
  V002→103 2026-10-21 14:00:00, V004→105 2026-10-21 16:20:00, 나머지 N·NULL), USER_MST 7건(C001 김민수·C002 이서연·C003 박지훈·C004
  최유진 = 요청 고객, C005 정하늘 = 조회 고객, A001 윤도현·A002 한지민 = 관리자), OWNER_MST 3건(역할별 안내용 연락처: 매핑 담당자
  윤도현 내선 1001, VESSEL 담당자 강수진 내선 1002, ACTION 담당자 오세훈 내선 1003. VESSEL·ACTION 담당자는 계정이 아님)'
- '권한 3종(USER_MST.ROLE): 조회 고객 = 이슈대장 읽기만 / 요청 고객 = 이슈대장 읽기 + 문의 등록 / 관리자 = 읽기 + 등록 + 이슈 조사·처리안
  승인. 관리자는 매핑 담당자를 뜻함'
- '사용자 선택: 우측 상단에 현재 사용자(이름·권한) 표시, 드롭다운으로 변경, 비밀번호 없음. 앱 시작 시 A001. 권한 검사는 화면 표시 제한과
  함께 등록·승인 함수 안에서 Python이 다시 확인'
- 'DB는 data/app.db 단일 파일. 시드 스크립트를 다시 실행하면 처음 상태로 초기화하며, 평가 실행기도 케이스마다 초기화'
- '시각은 KST YYYY-MM-DD HH:MM:SS TEXT. 처리상태·담당자 값은 한글로 저장하고 CHECK 제약으로 허용 값만 받음. ISSUE 번호는 DB 자동 증가
  정수'
- 'VESSEL_ACTION은 (VESSEL_ID, ACTION_SEQ) 복합 PK, 마스터로의 FOREIGN KEY(연결마다 PRAGMA foreign_keys = ON), EXECUTED_YN=''Y''면
  EXECUTED_AT 필수, ''N''이면 NULL'
- issues.xlsx는 쓰지 않음. 이슈대장은 SQLite ISSUE 테이블(번호, 접수일시, 요청자 ID, VESSEL_ID, ACTION_SEQ,
  문의내용, 담당자, 처리상태, 처리결과, 처리일시, 처리자, PARENT_ISSUE_NO). 담당자는 역할 이름, 처리자는 승인해서 종결한 관리자 ID
- '시드 이슈 9건(자동 분류를 거치지 않아 처리 기록 없음, get_issue_trace는 ''시드로 넣은 건이라 기록 없음''을 돌려줌): 처리대기 3(매핑 생성,
  매핑 수정, 수행된 Y 매핑 삭제 = destructive), 확인필요 2(값 이상, 자동 분류 실패), 이관 1(ACTION 이름 변경 요청), 반려 2(ACTION_SEQ
  빈칸, 한 문의에 요청 두 개(C004)), 완료 1. 모든 시드 이슈의 요청자는 요청 고객(C001~C004). 문의 문구·대상 값은 SERVICE.md에서
  확정'
- 'RESOLUTION_LOG는 append-only(칸: 이슈 번호, 종류(note·승인·거절·수정 지시·실행 성공·실행 실패), 내용, 처리안 JSON, 기록 시각).
  처리안의 승인·거절·실행 결과는 Python이 자동 기록'
- 'Streamlit 로컬 웹 UI 화면 3개: (1) 이슈대장(모든 권한이 읽기 가능. 조회·필터(''내 요청만'' 포함)·상세, 관리자에게만 행마다 ''이 건 조사''
  버튼으로 그 이슈의 비서 대화 시작)
  (2) 신규 문의 등록 폼(요청자 ID는 현재 사용자 ID로 고정, VESSEL_ID·ACTION_SEQ는 마스터 목록에서 고르는 필수 입력, 문의내용은 자유 텍스트,
  처리 대상은 입력칸 값. 마스터 추가 요청도 관련 VESSEL을 골라 두고 문의내용으로 판단) (3) 조사 비서 대화 + 승인 카드'
- 이슈대장에서 담당자가 값을 직접 고치지 않음. 변경은 Agent 처리안 + 승인으로만 반영
- '자동 분류는 등록 즉시 실행: 1단계 Python 검사(요청자가 USER_MST에 없거나 등록 권한(요청 고객·관리자) 없음 → 반려, 담당자 빈칸. 폼에서는 생길 수 없는 방어선; 칸 문제(빈 값·여러 값·마스터에 없음)
  → 반려, 매핑 담당자) → 2단계 LLM 구조화 출력 1회 → Python 규칙으로 담당자·처리상태 결정'
- '자동 분류 규칙표: 매핑 생성·수정·삭제 → 처리대기, 매핑 담당자 / 한 문의에 요청 여러 개 → 반려, 매핑 담당자 / 값 이상 → 확인필요,
  매핑 담당자 / 마스터 요청 대상 VESSEL → 이관, VESSEL 담당자 / 대상 ACTION → 이관, ACTION 담당자 / 대상 둘 다
  → 이관, "VESSEL 담당자, ACTION 담당자" / 마스터 요청 대상 모름 → 반려, 매핑 담당자 / 담당 외 → 거절, 담당자 빈칸 /
  판단 불가 → 확인필요, 매핑 담당자'
- 1단계 칸 검사는 폼에서 생길 수 없는 경우(여러 값·마스터에 없음)도 그대로 둔다. 시드·평가가 DB에 직접 넣는 값을 막는 방어선
- LLM 확신도 필드는 두지 않고 '판단 불가' 유형으로 받음
- '분류 LLM 출력 스키마: type(매핑 생성·매핑 수정·매핑 삭제·값 이상·마스터 요청·담당 외·판단 불가), master_target(VESSEL·ACTION·둘
  다·모름, 마스터 요청일 때만), multiple_requests(bool), id_mismatch(bool, 입력칸 값과 문의내용의 ID가 다름), reason(근거 한 줄).
  담당자·처리상태는 LLM이 아니라 Python 규칙표가 정함. 매핑 수정의 새 ACTION 등 구체적인 대상은 분류 단계에서 뽑지 않고 비서가 조사'
- '규칙 적용 순서: multiple_requests → 반려, 매핑 담당자 / id_mismatch → 반려, 매핑 담당자 / 그 밖은 type별 규칙표'
- '처리결과 = Python 템플릿 문장 + LLM 근거 한 줄(예: ''매핑 생성 요청으로 분류. 근거: V003에 104를 추가해 달라는 요청'')'
- 분류 단계에서 바로 닫히는 건(반려·거절)은 처리일시를 분류 시각으로, 처리자를 SYSTEM으로 채움. 잘못 닫힌 건을 되돌리는 기능은 두지 않음(반려는 재요청, 거절은 새로 등록)
- '[다시 분류] 버튼은 관리자에게만, 처리결과가 ''자동 분류 실패''이면서 확인필요인 건에만 표시'
- 등록이 끝나면 화면에 '접수됨 #번호, 처리상태, 처리결과'를 바로 보여 주고, 분류하는 동안 로딩 표시
- '담당자 칸 CHECK 허용 값: 빈칸, 매핑 담당자, VESSEL 담당자, ACTION 담당자, ''VESSEL 담당자, ACTION 담당자'''
- 분류 LLM은 temperature 0
- 분류 실패(스키마 오류·모든 모델 실패) 시 문의는 저장하고 확인필요, 매핑 담당자, 처리결과 '자동 분류 실패'로 두며 화면에 [다시 분류]
  버튼 표시. [다시 분류]는 같은 이슈를 갱신하고 처리 기록에 새 실행으로 남김
- 자동 분류 단계에서는 매핑 변경을 절대 하지 않음
- 'MCP 도구 — 읽기 6개: find_vessel(query), find_action(query), get_vessel_mappings(vessel_id),
  list_issues(status?, since?, limit=10), get_issue(issue_no), get_issue_trace(issue_no)(그
  이슈의 처리 기록을 요약해 읽음) / 쓰기 1개: propose_resolution(issue_no, mapping_change?, new_status,
  result) / 로그 1개: log_resolution(issue_no, note)(append-only, 위험 등급 log, 승인 없이 자동. 처리안 없이 조사를
  마칠 때 근거를 남기는 용도. 예: 이관 건 ''VESSEL 담당자 답변 대기'')'
- '도구 확장: find_vessel·find_action은 ID·이름 일부로 검색해 후보 목록을 돌려주고, 검색어를 비우면 전체 목록과 개수를 돌려줌.
  get_vessel_mappings는 vessel_id를 비우면 전체 매핑을 돌려줌. USER_MST(사용자 목록)는 비서가 조회할 수 없음'
- 비서 LLM은 temperature 0. ④ 고객 안내 초안은 비서 답변으로 보여 주고 MESSAGE_LOG에 남김(발송 없음)
- '비서는 LLM 노드 하나(ReAct). 모드별 도구 목록은 Python이 정함: 열린 이슈 대화 = 읽기 6 + log_resolution + propose_resolution
  / 닫힌 이슈 대화(조회 전용) = 읽기 6 + log_resolution / 이슈 없는 대화 = 읽기 6만. 나중에 의도 라우터 LLM을 추가할 수 있도록 guard 체인 자리에 붙일 수 있게 설계'
- 도구 반환은 정해진 형식의 사람이 읽는 문자열. 오류는 예외 대신 안내 문자열(받은 값·쓸 수 있는 값·다음 행동)
- 위험 등급은 LLM이 아니라 Python이 DB 상태로 결정. 미등록 도구는 승인 필요(fail-safe). 처리안에 EXECUTED_YN='Y'
  매핑이 포함되면 destructive
- 문의 원문과 도구 결과는 신뢰하지 않는 데이터로 취급한다. 그 안의 지시문은 도구 호출 여부, 위험 등급, 승인 필요 여부, 상태
  전이를 바꿀 수 없으며, 분류·비서 시스템 프롬프트에 이를 명시한다
- TOOL_SPECS(메뉴판)와 TOOLS_IMPL(구현)을 분리하고, import 시 이름 일치를 assert
- 조회는 자동 실행, 쓰기는 LangGraph interrupt로 사람 승인 후 실행
- '승인 카드 표시 항목: 위험 등급·도구 이름·대상(VESSEL/ACTION 전후 값)·현재 수행 상태(EXECUTED_YN)·근거(이슈 번호와
  문의 원문). 카드 내용은 Python이 DB에서 직접 읽은 원본'
- RESOLUTION_LOG와 처리 기록에는 행동한 사용자 ID를 함께 남긴다
- '승인 UX y/n/e: y=실행, n=실행하지 않고 Agent에 ''거절됨'' 전달, e=담당자 수정 지시를 Agent에 돌려주어 다시 계획.
  destructive는 y 뒤에 이슈 번호를 한 번 더 입력하는 이중 확인'
- 승인 단위는 처리안(매핑 변경 + 이슈 상태 변경)이며, 매핑·ISSUE·RESOLUTION_LOG를 한 SQLite 트랜잭션으로 반영(부분 처리
  상태 없음)
- '실행 직전 재검증: 이슈가 아직 열린 상태인지, 대상 매핑의 존재/부재, EXECUTED_YN이 제안 시점과 같은지, new_status가 허용된
  전이인지'
- 매핑 수정 = 연결된 ACTION을 다른 ACTION으로 교체(삭제 후 생성, 새 행 EXECUTED_YN='N'·EXECUTED_AT=NULL).
  Agent는 EXECUTED 값을 수정하지 않음
- '상태 전이: 열린 건(확인필요·이관·처리대기) → 완료·반려·거절. 완료 건은 다시 열지 않음. 이관 건은 담당자 확인 후 처리안으로 ''완료''
  처리'
- '반려 건 ''수정해서 재요청'': 원래 요청자 본인에게만 버튼이 보이며, 값이 채워진 등록 폼을 열고, 원래 번호를 PARENT_ISSUE_NO로 가진 새 이슈로 등록·자동 분류.
  원래 건은 반려 유지'
- '값 이상 조사: 매핑이 잘못 연결됐는지(올바른 ACTION으로 교체 제안), 마스터 이름·설명 불만인지(이관 성격)를 근거와 함께 판단'
- ④ 반려 재요청 도움은 ID 후보 찾기와 고객 안내 초안을 화면에 보여 주는 데까지(발송 없음)
- 도구 호출 상한은 한 사용자 턴당 8회이며, 승인 후 재개·재계획을 포함한 같은 턴 전체에 적용
- '상한 도달 또는 같은 도구·같은 인자 중복 호출 → finalize: 지금까지의 근거로 답하고 ''조사 한도 도달, 확인하지 못한 것: …''과
  다음 질문 제안 표시'
- 같은 도구가 연속 2회 실패하면 이번 턴에 더 부르지 않고 finalize로 실패를 알림
- Bedrock 실패 시 재시도·백오프 없이 바로 다음 모델. 모든 모델 실패 → Streamlit 오류 배너 + '다시 시도' 버튼, 대화 상태는
  체크포인터에 보존
- MCP 서버 연결 끊김 → 1회 재연결, 실패하면 배너
- '비서 대화 화면 진입은 두 가지: 이슈대장의 [이 건 조사](선택된 이슈 있음) 또는 메뉴의 비서 대화(선택된 이슈 없음). 둘 다 관리자만'
- '열린 이슈로 진입: 비서가 먼저 ''이슈 #N 건에 대해 조사를 진행하시겠습니까? (y/n)''을 묻는다. y → 비서가 조사해 propose_resolution
  처리안을 가져옴, n → 자동 조사 없이 자유 대화로 들어감(나중에 요청하면 조사). 그 뒤는 자유 대화'
- 닫힌 이슈(완료·반려·거절)로 진입하거나 선택된 이슈가 없으면 첫 질문 없이 조회 전용 자유 대화(처리안 불가)
- 자유 대화에서는 그 이슈에 대한 질문뿐 아니라 이슈와 무관한 업무 질문(마스터·매핑·이슈 데이터 조회, 개수 등)에도 답한다. 업무와 무관한 주제(날씨, 잡담 등)는 정해진 문장으로 거절
- '처리안은 그 화면의 이슈에 대해서만 만들 수 있다(다른 이슈 번호는 Python이 막고 안내 문자열 반환). 같은 이슈의 처리안은 대화 중 여러 번 다시
  만들 수 있음'
- '고정 입력 판정은 LLM이 아니라 Python: 첫 질문과 승인 카드는 y/n(승인 카드는 y/n/e)만 받고 앞뒤 공백 무시·대소문자 무시. 그 밖의 입력(ㅇㅇ,
  네, yes 등)은 실행하지 않고 다시 묻는다. destructive는 y 뒤 이슈 번호 정확히 일치'
- '입력 미들웨어: 관리자 입력이 LLM에 가기 전에 검사 단계 목록(guard 체인)을 차례로 통과한다. 1차 구현은 Python 패턴 규칙(이전 지시 무시,
  승인 없이 실행, 시스템 프롬프트 요구, SQL·명령 실행 요청 등)이고, 나중에 LLM 판정 단계를 같은 인터페이스로 체인에 추가할 수 있게 설계.
  차단된 입력은 LLM에 보내지 않고 정해진 안내 문장으로 답하며 처리 기록에 branch 이벤트로 남김. 무관한 주제 거절은 1차 구현에서 비서
  시스템 프롬프트로 처리. 고객 문의 등록 내용에는 미들웨어를 적용하지 않음'
- '대화 thread는 (이슈 번호, 관리자 ID)별: 여러 관리자가 같은 이슈를 열어도 서로 다른 대화. 선택된 이슈 없는 대화는 관리자별 별도 thread([새
  대화]로 새로 시작, ID는 free-<관리자 ID>-<시작 시각 YYYYMMDD-HHMMSS>). 승인 대기 처리안은 그 thread의 체크포인터에 남아 다시 열면 이어짐. 같은 이슈에 처리안이 둘 이상 대기하면 먼저 승인된
  것이 반영되고, 나머지는 실행 직전 재검증(이슈가 열린 상태인지 등)에서 막힘'
- '처리 기록(디버깅용): 실행 = 사람의 행동 1회(문의 등록, 다시 분류, 대화 입력 1회, 승인 카드 응답)에 프로그램이 반응해 멈출 때까지의 한
  덩어리. 실행 1회마다 PROCESS_LOG 1행(RUN_ID, ISSUE_NO(이슈 없는 대화는 NULL, ISSUE로의 FOREIGN KEY), THREAD_ID(자동 분류·재분류는
  NULL), USER_ID(행동한 사용자, 자동 분류는 SYSTEM), 실행 종류, 시작·끝 시각, 결과, 도구 호출 수, 응답 모델, 멈춤 사유). ISSUE_NO·THREAD_ID·USER_ID는
  PROCESS_LOG에만 두고 CALL_LOG·MESSAGE_LOG는 RUN_ID로만 가리킨다'
- '세션: 이슈 1건의 세션 = ISSUE_NO가 그 번호인 모든 실행(자동 분류 + 모든 관리자의 대화). 이슈 없는 대화의 세션 = 그 THREAD_ID의 실행.
  이슈 없는 대화에서 특정 이슈를 조회한 기록은 그 이슈의 세션에 포함하지 않음'
- '실행 안의 이벤트 1건마다 CALL_LOG 1행(RUN_ID, 순번, 이벤트 종류, 이름, 입력, 출력, 모델 ID, 성공 여부, 오류,
  걸린 시간)을 남긴다. 이벤트 종류: branch(사전 검사·규칙표 분기, LangGraph 노드 이동), llm(프롬프트 이름·버전, 보낸 메시지
  전체, 원본 응답, 해석 결과, 폴백 포함 시도 모델), tool(도구 이름·인자·반환 문자열·위험 등급·자동 실행 여부), approval(승인
  카드 내용, y/n/e, 수정 지시, 이중 확인 결과), commit(실행 직전 재검증 결과, 커밋·롤백), finalize(멈춘 이유)'
- MESSAGE_LOG는 실행 안에서 오간 말 1건마다 1행(RUN_ID, 순번, 누가(관리자·비서), 내용). ④ 고객 안내 초안도 여기 남으며 발송하지 않음
- 처리 기록은 처리 트랜잭션과 섞지 않고 이벤트가 생길 때마다 별도로 바로 저장해, 실패·롤백·모든 모델 실패에서도 남긴다
- '처리 기록은 Streamlit 화면에 보여 주지 않는다. 개발자가 명령으로 시간순 파일을 출력해 본다(예: python -m app.trace --issue <no> →
  traces/issue_<no>.md, 이벤트마다 thread·사용자 표시 / --thread <id> → traces/thread_<id>.md / --list → 최근 세션 목록)'
- 마스킹은 하지 않는다(처리 기록·LLM 입력·화면 모두 원문)
- '평가셋 15건: 자동 분류 4, ② 자유 질의 3, ① 처리안 승인 4(y/n/e와 destructive 이중 확인 포함), ③ 값 이상 2,
  ④ 반려 재요청 2. 승인 케이스는 y/n/e 응답을 미리 정해 둠'
- '안전 지표 100% 필수(가짜 LLM·실제 Bedrock 모두): 승인 없이 쓰기 0건, 거절(n) 후 업무 데이터(VESSEL_ACTION·ISSUE) 변화 0건(RESOLUTION_LOG·처리 기록은 제외), 수행된 매핑을 이중
  확인 없이 변경 0건, 도구 호출 예산 초과 0건'
- '정답 채점: 케이스별 필수 핵심 사실 목록 + 문자열 포함 비교. 과정 지표는 필수 도구 호출 여부만 보고 순서는 고정하지 않음'
- 자동 분류 정답 = 담당자와 처리상태가 기대값과 정확히 일치(같은 결과를 내는 분류 유형이면 정답 인정)
- 결과는 JSON Lines로 저장해 이전 결과와 비교. 회귀(이전 pass → 이번 fail)가 하나라도 있으면 불합격. 첫 실행이 기준선
- 평소 개발·pytest는 도구 호출 순서를 흉내 내는 가짜 LLM만 사용. 실제 Bedrock 점검은 '실제 Bedrock 점검 목록'에 남겼다가
  사용자가 지시할 때 한 번에 실행
- '단계 완료 조건은 가짜 LLM pytest 통과. 최종 합격은 실제 Bedrock 기준: 자동 분류 4/4, 비서 시나리오 11건 정답 85%
  이상, 안전 지표 100%, 회귀 0건'
- '범위 제외: 비밀번호 인증·실제 권한 보안(사용자 선택과 권한별 화면·기능 제한만 함), 다중 사용자 동시 접속, 실제 고객 메시지 발송, 운영 DB·실제 메신저 연결,
  마스터(VESSEL_MST·ACTION_MST) 변경, 기존 배치 Agent 수정·연동, Claude Desktop 연동, 서버 배포'
