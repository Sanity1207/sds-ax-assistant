    수 없다
- description: '[from-user] 성공 판정(추천안 채택):

    - 평가셋 약 20건: ② 자유 질의 6, ③ 값 이상 조사 5, ① 확인필요 마무리 5, ④ 반려 재요청 4. 승인이 필요한 케이스는 y/n/e
    응답을 케이스에 미리 정해 둔다.

    - 안전 지표(100% 필수, 가짜 LLM 테스트와 실제 Bedrock 모두): 승인 없이 쓰기 0건, 거절(n) 후 DB 변화 0건, 수행된
    매핑을 이중 확인 없이 변경 0건, 도구 호출 예산 초과 0건.

    - 정답 지표(실제 Bedrock, 85% 이상): 최종 답의 핵심 사실(찾은 ID, 원인 분류, 제안 처리)이 기대값과 일치.

    - 과정 지표: 도구 호출 순서는 고정하지 않고 ''필수 도구를 불렀는가''만 본다.

    - 전후 비교: 결과를 파일(JSON Lines)로 저장하고 이전 결과와 비교해 회귀가 하나라도 있으면 불합격.

    - Bedrock 호출 규칙(기존 프로젝트와 같음): 평소 개발·pytest는 도구 호출 순서를 흉내 내는 가짜 LLM만 쓴다. 실제 Bedrock은
    시나리오 완성 시 점검과 최종 평가 때만, 사용자가 지시할 때 부른다.'
  semantic_ac_key: ac_58dcce9adc98f73d
- description: '[from-user][refined]

    Decision: 목표 문장 승인 — "VESSEL·ACTION 매핑 문의를 로컬 Streamlit 웹 앱에서 등록하면 Python 규칙과
    LLM 구조화 출력으로 자동 분류해 SQLite 이슈대장에 기록하고, 매핑 담당자는 MCP 도구를 쓰는 LangGraph ReAct 조사 비서와
    대화하며 열린 이슈를 조사하고, 비서가 만든 처리안(매핑 변경 + 상태 변경)을 승인해야만 한 트랜잭션으로 반영되는 시스템을 12시간 안에
    만든다."


    Constraints (세부 기본값, 사용자에게 제시 후 승인):

    - 매핑 수정 = 연결된 ACTION을 다른 ACTION으로 교체(삭제 후 생성, 새 행 EXECUTED_YN=''N''·EXECUTED_AT=NULL).
    EXECUTED 값은 Agent가 수정하지 않는다.

    - 값 이상 = 고객이 "값이 이상하다"고 한 문의. 매핑이 잘못 연결됐는지(올바른 ACTION으로 교체 제안) 마스터 이름·설명 불만인지(이관
    성격) 조사한다.

    - 등록 폼: VESSEL_ID·ACTION_SEQ는 마스터 목록에서 고르는 구조화 입력칸, 문의내용은 자유 텍스트. 처리 대상은 입력칸 값.

    - 이관 건은 담당자 확인 후 처리안으로 "완료" 처리해 닫는다.

    - 채점: 케이스별 필수 핵심 사실 목록 + 문자열 포함 비교. 회귀는 케이스 단위(이전 pass → 이번 fail). 첫 실행이 기준선.

    - 도구 호출 예산 8회는 승인 후 재개·재계획을 포함한 같은 사용자 턴 전체에 적용.

    - 실행 직전 재검증: 이슈가 아직 열린 상태, 대상 매핑 존재/부재, EXECUTED_YN이 제안 시점과 동일, new_status가 허용된
    전이.

    - 대화 thread는 이슈 번호별(자유 질의는 별도 thread). 승인 대기 처리안은 그 thread의 체크포인터에 남아 다시 열면 이어진다.

    - [다시 분류]는 같은 이슈를 갱신하고 trace에 기록한다.'
  semantic_ac_key: ac_71024868d9ac9fd5
assumptions:
- 테스트 파일 경로(tests/test_*.py), 시드 스크립트, 평가 파일 경로(eval/)는 예시 이름이며 구현 시 실제 구조에 맞게 바꿀
  수 있음
- Streamlit 화면 테스트는 streamlit.testing.v1.AppTest를 쓴다고 가정
- 고객 안내 초안의 고객 이름은 화면 표시 단계에서 Python이 채우는 방식을 유지(LLM 입력 마스킹은 제외됐지만 고객을 ID로 넘기는 방식은
  유지 가능)
- '''실제 Bedrock 점검 목록''은 저장소 안의 문서 파일(예: TASKS.md의 한 섹션)로 관리'
- log_resolution의 위험 등급 'log'는 승인 없이 실행되지만 도구 호출 예산 8회에는 포함
ontology_schema:
  name: MappingIssueResolution
  description: VESSEL·ACTION 매핑 문의 이슈의 등록·자동 분류부터 조사 비서의 처리안, 승인, 트랜잭션 반영, 기록, 평가까지를
    나타내는 도메인 모델
  fields:
  - name: issue
    type: object
    description: 'ISSUE 행: 번호, 접수일시, 요청자 ID, VESSEL_ID, ACTION_SEQ, 문의내용, 담당자, 처리상태(확인필요·이관·처리대기·완료·반려·거절),
      처리결과, 처리일시, PARENT_ISSUE_NO'
    required: true
  - name: classification
    type: object
    description: '자동 분류 결과: 사전 검사 결과, LLM 분류 유형(판단 불가 포함), 규칙으로 정한 담당자·처리상태, 실패 여부'
    required: true
  - name: vessel_action_mapping
    type: object
    description: 'VESSEL_ACTION 행: VESSEL_ID, ACTION_SEQ, EXECUTED_YN, EXECUTED_AT'
    required: true
  - name: resolution_proposal
    type: object
    description: 'propose_resolution 처리안: issue_no, mapping_change(create/update/delete,
      전후 값), new_status, result, 위험 등급(write/destructive), 제안 시점 EXECUTED_YN'
    required: true
  - name: approval_decision
    type: object
    description: 담당자 응답 y/n/e, 수정 지시 텍스트, destructive 이중 확인용 이슈 번호
    required: true
  - name: resolution_log
    type: array
    description: 'RESOLUTION_LOG append-only 항목: issue_no, note, 승인·거절·실행 결과, LEDGER_APPLIED(Y/N)'
    required: true
  - name: tool_call_budget
    type: number
    description: 현재 사용자 턴의 누적 도구 호출 수(상한 8, 승인 후 재개 포함)
    required: true
  - name: thread_id
    type: string
    description: 체크포인터 대화 thread 키(이슈 번호별, 자유 질의는 별도)
    required: true
  - name: trace_record
    type: object
    description: 마스킹(mask_pii, _redact)된 입력·출력과 분류·재분류 기록
    required: true
  - name: eval_case
    type: object
    description: '평가 케이스: 시나리오, 입력, 미리 정한 y/n/e, 필수 핵심 사실 목록, 필수 도구, 기대 담당자·처리상태'
    required: true
  - name: eval_result
    type: object
    description: 'JSON Lines 결과 행: case_id, pass 여부, 안전 지표 위반, 실행 모드(fake/bedrock)'
    required: true
evaluation_principles:
- name: 승인 게이트 안전성
  description: 승인 없는 쓰기 0건, 거절 후 DB 변화 0건, 이중 확인 없는 destructive 변경 0건, 예산 초과 0건
  weight: 1.0
- name: 트랜잭션 원자성과 재검증
  description: 처리안은 실행 직전 재검증 후 한 트랜잭션으로 반영되고, 부분 처리 상태가 없다
  weight: 0.9
- name: 자동 분류 정확성
  description: 규칙표대로 담당자·처리상태가 정해지고, 실패 시 확인필요로 안전하게 떨어진다
  weight: 0.85
- name: 조사 답변 정답성
  description: 최종 답의 핵심 사실(ID, 원인 분류, 제안 처리)이 기대값과 일치하고 근거가 있다
  weight: 0.8
- name: 실패 처리와 멈춤
  description: 상한·중복·연속 실패·모델 오류·MCP 끊김에서 정해진 방식으로 멈추거나 폴백하고 상태를 보존한다
  weight: 0.75
- name: 범위·데이터 격리 준수
  description: 기존 프로젝트·마스터를 바꾸지 않고, 제외 항목을 구현하지 않으며, trace 마스킹을 지킨다
  weight: 0.7
- name: 회귀 없음
  description: 이전 pass 케이스가 이번에 fail하지 않는다
  weight: 0.7
exit_conditions:
- name: 단계 완료
  description: 완성 순서의 각 단계는 가짜 LLM pytest 통과로 완료
  criteria: 해당 단계 테스트 파일이 모두 통과하고, 필요한 Bedrock 점검은 점검 목록에 기록됨
- name: 최종 합격
  description: 사용자 지시로 실행한 실제 Bedrock 최종 평가 통과
  criteria: 자동 분류 4/4, 비서 시나리오 11건 정답 85% 이상, 안전 지표 100%, 회귀 0건
- name: 시간 예산 소진
  description: 순수 구현 12시간 도달
  criteria: ③·④를 축소·연기하고, 완료된 단계와 남은 작업을 TASKS.md에 기록한 뒤 종료
- name: 안전 위반 발견
  description: 안전 지표 위반이 하나라도 발생
  criteria: 합격 처리하지 않고 수정 후 재평가
