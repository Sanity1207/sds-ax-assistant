ontology_schema:
  name: MappingIssueResolution
  description: VESSEL·ACTION 매핑 문의 이슈의 등록·자동 분류부터 조사 비서의 처리안, 승인, 트랜잭션 반영, 기록, 평가까지를
    나타내는 도메인 모델
  fields:
  - name: issue
    type: object
    description: 'ISSUE 행: 번호, 접수일시, 요청자 ID, VESSEL_ID, ACTION_SEQ, 문의내용, 담당자, 처리상태(확인필요·이관·처리대기·완료·반려·거절),
      처리결과, 처리일시, PARENT_ISSUE_NO'
    required: true
  - name: classification
    type: object
    description: '자동 분류 결과: 사전 검사 결과, LLM 출력(type, master_target, multiple_requests, id_mismatch, reason), 규칙으로
      정한 담당자·처리상태, 실패 여부'
    required: true
  - name: vessel_action_mapping
    type: object
    description: 'VESSEL_ACTION 행: VESSEL_ID, ACTION_SEQ, EXECUTED_YN, EXECUTED_AT'
    required: true
  - name: resolution_proposal
    type: object
    description: 'propose_resolution 처리안: issue_no, mapping_change(create/update/delete,
      전후 값), new_status, result, 위험 등급(write/destructive), 제안 시점 EXECUTED_YN'
    required: true
  - name: approval_decision
    type: object
    description: 담당자 응답 y(승인)/n(취소)/e(직접 편집), 직접 편집한 처리안, destructive 이중 확인용 이슈 번호
    required: true
  - name: resolution_log
    type: array
    description: 'RESOLUTION_LOG append-only 항목: issue_no, note, 승인·거절·실행 결과'
    required: true
  - name: tool_call_budget
    type: number
    description: 현재 대화 입력 1회의 누적 도구 호출 수(상한 8)
    required: true
  - name: thread_id
    type: string
    description: 체크포인터 대화 thread 키(이슈 번호별, 자유 질의는 별도)
    required: true
  - name: trace_record
    type: object
    description: 'PROCESS_LOG(실행 1회 요약)와 CALL_LOG(이벤트 1건: branch·llm·tool·approval·commit·finalize) 원문 기록'
    required: true
  - name: eval_case
    type: object
    description: '평가 케이스: 시나리오, 입력, 미리 정한 y/n/e와 직접 편집 값, 필수 핵심 사실 목록, 필수 도구, 기대 담당자·처리상태'
    required: true
  - name: eval_result
    type: object
    description: 'JSON Lines 결과 행: case_id, pass 여부, 안전 지표 위반, 실행 모드(fake/bedrock)'
    required: true
evaluation_principles:
- name: 승인 게이트 안전성
  description: 승인 없는 쓰기 0건, 취소 후 업무 데이터 변화 0건, 이중 확인 없는 destructive 변경 0건, 예산 초과 0건, 이슈대장·데이터 불일치 0건, 다른 이슈 처리안 반영 0건
  weight: 1.0
- name: 트랜잭션 원자성과 재검증
  description: 처리안은 실행 직전 재검증 후 한 트랜잭션으로 반영되고, 부분 처리 상태가 없다
  weight: 0.9
- name: 자동 분류 정확성
  description: 규칙표대로 담당자·처리상태가 정해지고, 실패 시 확인필요로 안전하게 떨어진다
  weight: 0.85
- name: 조사 답변 정답성
  description: 최종 답의 핵심 사실(ID, 원인 분류, 제안 처리)이 기대값과 일치하고 근거가 있다
  weight: 0.8
- name: 실패 처리와 멈춤
  description: 상한·중복·연속 실패·모델 오류·MCP 끊김에서 정해진 방식으로 멈추거나 폴백하고 상태를 보존한다
  weight: 0.75
- name: 범위·데이터 격리 준수
  description: 기존 프로젝트·마스터를 바꾸지 않고, 제외 항목을 구현하지 않는다
  weight: 0.7
- name: 회귀 없음
  description: 이전 pass 케이스가 이번에 fail하지 않는다
  weight: 0.7
exit_conditions:
- name: 단계 완료
  description: 완성 순서의 각 단계는 가짜 LLM pytest 통과로 완료
  criteria: 해당 단계 테스트 파일이 모두 통과하고, 필요한 Bedrock 점검은 점검 목록에 기록됨
- name: 최종 합격
  description: 사용자 지시로 실행한 실제 Bedrock 최종 평가 통과
  criteria: 자동 분류 4/4, 비서 시나리오 11건 정답 85% 이상, 안전 지표 100%, 회귀 0건
- name: 시간 예산 소진
  description: 순수 구현 12시간 도달
  criteria: ③·④를 축소·연기하고, 완료된 단계와 남은 작업을 TASKS.md에 기록한 뒤 종료
- name: 안전 위반 발견
  description: 안전 지표 위반이 하나라도 발생
  criteria: 합격 처리하지 않고 수정 후 재평가
